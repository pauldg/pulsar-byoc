---
# Variables for galaxyproject.pulsar
pulsar_package_version: "0.15.15"
pulsar_server_dir: /opt/pulsar
pulsar_venv_dir: "{{ pulsar_server_dir }}/venv"
pulsar_config_dir: "{{ pulsar_server_dir }}/config"
pulsar_persistence_dir: "{{ pulsar_server_dir }}/files/persisted_data"
pulsar_staging_dir: "{{ pulsar_shared_dir }}/staging"
pulsar_dependencies_dir: "{{ pulsar_shared_dir }}/deps"

pulsar_user: "{{ pulsar_user_name }}"
pulsar_create_user: false

pulsar_systemd: true
pulsar_systemd_runner: webless
pulsar_systemd_environment: >-
  {{ ['DRMAA_LIBRARY_PATH=' ~ pulsar_drmaa_library_path] if pulsar_scheduler == 'slurm' else [] }}

pulsar_optional_dependencies: >-
  {{ ['pycurl', 'requests', 'psutil']
     + (['kombu', 'pyOpenSSL'] if pulsar_connection == 'mq' else ['pulsar-relay-client==0.2.1'])
     + (['drmaa'] if pulsar_scheduler == 'slurm' else []) }}

pulsar_yaml_config: >-
  {{ pulsar_base_config | combine(pulsar_relay_config if pulsar_connection == 'relay' else {}) }}

pulsar_base_config:
  message_queue_url: "{{ pulsar_message_queue_url }}"
  min_polling_interval: 0.5
  conda_auto_init: false
  conda_auto_install: false
  managers:
    _default_: "{{ pulsar_managers[pulsar_scheduler] | combine(pulsar_staging_retries) }}"

# An https:// message_queue_url switches Pulsar to relay mode
pulsar_relay_config:
  message_queue_username: "{{ pulsar_relay_username }}"
  message_queue_password: "{{ pulsar_relay_password }}"
  relay_topic_prefix: "{{ pulsar_relay_topic_prefix }}"

pulsar_managers:
  slurm:
    type: queued_drmaa
  htcondor:
    type: queued_condor
    submit_universe: vanilla

pulsar_staging_retries:
  preprocess_action_max_retries: 10
  preprocess_action_interval_start: 2
  preprocess_action_interval_step: 2
  preprocess_action_interval_max: 30
  postprocess_action_max_retries: 10
  postprocess_action_interval_start: 2
  postprocess_action_interval_step: 2
  postprocess_action_interval_max: 30

pulsar_build_packages:
  Debian: [build-essential, python3-venv, python3-dev, libcurl4-gnutls-dev, libgnutls28-dev]
  RedHat: [gcc, python3-devel, libcurl-devel, openssl-devel]

# No EL package yet, see README
pulsar_slurm_drmaa_package:
  Debian: slurm-drmaa1
pulsar_drmaa_library_path: /usr/lib/slurm-drmaa/lib/libdrmaa.so.1
